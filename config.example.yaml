# Скопируйте в config.yaml и заполните значения.
# config.yaml не коммитится в git.

app:
  name: yauza-photofactory
  env: development  # development | staging | production
  base_url: https://photofactory.example.com  # для ссылок в Telegram

paths:
  incoming: /srv/yauza/incoming
  originals: /srv/yauza/originals
  backup: /srv/yauza/backup
  # На MVP до появления event/session:
  default_event_id: default
  default_session_id: unnamed

batch:
  # Секунды без новых файлов → пачка считается завершённой
  silence_seconds: 60
  # Интервал проверки incoming-папок
  poll_seconds: 5
  # Локальная дублирующая копия в /backup.
  # Для продуктового режима сценариев 1+2 можно отключить (false),
  # если доверяем зеркалу Я.Диска.
  write_backup_copy: true
  # Расширения (нижний регистр после нормализации)
  allowed_extensions:
    - .jpg
    - .jpeg
    - .cr2
    - .cr3
    - .nef
    - .arw
    - .dng
    - .raf
    - .rw2
    - .orf
    - .pef
  # Дедупликация: skip | overwrite (уточняется в watcher)
  duplicate_policy: skip

ftp:
  # Документация: один логин на всю incoming-зону
  # Реальный пароль — только в config.yaml на сервере / в secrets
  username: upload
  # password: задайте в config.yaml
  chroot: true
  # Пассивный режим (заполнить на VPS после настройки vsftpd)
  passive_port_min: 40000
  passive_port_max: 40050

database:
  url: postgresql://photofactory:CHANGE_ME@127.0.0.1:5432/photofactory

api:
  host: 127.0.0.1
  port: 8000

auth:
  # Основной пользователь бильда
  username: bild
  password: CHANGE_ME_STRONG_PASSWORD
  # Админ-пользователь: видит расширенные настройки системы
  admin_username: admin
  admin_password: CHANGE_ME_ADMIN_PASSWORD
  jwt_secret: CHANGE_ME_VERY_LONG_RANDOM_SECRET
  token_ttl_minutes: 120

notifications:
  enabled: true
  channels:
    - telegram
    # - max
    # - pwa
  telegram:
    bot_token: "YOUR_BOT_TOKEN"
    # chat_id группы редакции или личный
    default_chat_id: "-100xxxxxxxxxx"
  max:
    # URL входящего вебхука MAX-интеграции
    webhook_url: ""
    # Опциональный токен авторизации для MAX webhook
    auth_token: ""
  pwa:
    enabled: false
    vapid_public_key: ""
    vapid_private_key: ""
    vapid_subject: "mailto:admin@yauza-media.ru"

yandex_disk:
  # false: кнопки в кабинете останутся, но API вернёт "integration disabled"
  enabled: false
  oauth_token: ""
  remote_base_path: /YauzaPhotofactory

logging:
  level: INFO
  file: /var/log/yauza/photofactory.log
